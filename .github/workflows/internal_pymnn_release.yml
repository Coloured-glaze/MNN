name: internal_pymnn_release
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        default: '3.10'
        required: true
        type: string
      build_options:
        description: 'Build options (comma-separated): cuda, llm, opencl, vulkan, openmp, trt, torch, internal, render, no_sse, cuda_tune'
        default: 'llm, opencl, vulkan, openmp'
        required: false
        type: string
      install_cuda:
        description: 'Install CUDA on Windows'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '0'
      repository:
        description: 'Code repo (leave empty for current repo)'
        default: ''
        required: false
        type: string
      tag_name:
        description: 'Tag name for release (e.g., v3.4.0)'
        default: ''
        required: false
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '0'
      build_date:
        description: 'Build date (YYYYMMDD, leave empty for today)'
        default: ''
        required: false
        type: string
      cuda_version:
        description: 'CUDA version for tag (e.g., 12.1)'
        default: ''
        required: false
        type: string
      avxver:
        description: 'AVX version for tag (e.g., avx2, avx512)'
        default: ''
        required: false
        type: string
      enable_avx2:
        description: 'Enable AVX2 compilation (x86_64 only)'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '1'
      enable_avx512:
        description: 'Enable AVX512 compilation (x86_64 only, requires AVX2)'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '0'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
          - { os: windows-latest,   arch: AMD64 }

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}

    - name: using msvc
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install CUDA on Windows
      if: matrix.os == 'windows-latest' && inputs.install_cuda == '1'
      run: |
        # Download CUDA installer
        $cudaVersion = "12.1.1"
        $cudaInstaller = "cuda_${cudaVersion}_531.14_windows.exe"
        $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/${cudaVersion}/local_installers/${cudaInstaller}"
        
        Write-Host "Downloading CUDA installer from $cudaUrl"
        Invoke-WebRequest -Uri $cudaUrl -OutFile $cudaInstaller
        
        # Install CUDA silently
        Write-Host "Installing CUDA..."
        Start-Process -FilePath $cudaInstaller -ArgumentList "-s" -Wait
        
        # Set CUDA environment variables
        $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${cudaVersion}"
        [Environment]::SetEnvironmentVariable("CUDA_PATH", $cudaPath, "Machine")
        [Environment]::SetEnvironmentVariable("CUDA_HOME", $cudaPath, "Machine")
        $cudaBinPath = "$cudaPath\bin"
        [Environment]::SetEnvironmentVariable("Path", $env:Path + ";$cudaBinPath", "Machine")
        
        # Verify installation
        nvcc --version
        
        Write-Host "CUDA installation completed"
      shell: powershell

    - name: using private schema patch
      if: matrix.os != 'windows-latest'
      env:
        PATCH_CONTENT: ${{ secrets.PRIVATE_SCHEMA_PATCH }}
      run: |
        # Check if patch content is empty
        if [ -z "$PATCH_CONTENT" ]; then
          echo "No patch content provided, skipping patch application"
        else
          patch_file=$(mktemp schema_patch.XXXXXX.diff)
          echo "$PATCH_CONTENT" > $patch_file
          
          # Apply patch with --allow-empty flag to handle empty patches
          git apply --allow-empty $patch_file || echo "Patch application failed or was empty, continuing..."
          rm $patch_file
        fi
        
        git status
        cd schema
        ls -lh
        ./generate.sh
        cd ..
        git status
    - name: using private schema patch
      if: matrix.os == 'windows-latest'
      env:
        PATCH_CONTENT: ${{ secrets.PRIVATE_SCHEMA_PATCH }}
      run: |
        # Check if patch content is empty
        if ([string]::IsNullOrEmpty($env:PATCH_CONTENT)) {
          Write-Host "No patch content provided, skipping patch application"
        } else {
          $patchFile = [System.IO.Path]::GetTempFileName() + ".diff"
          [System.IO.File]::WriteAllText($patchFile, $env:PATCH_CONTENT)
          
          # Apply patch with --allow-empty flag to handle empty patches
          try {
            git apply --allow-empty $patchFile
          } catch {
            Write-Host "Patch application failed or was empty, continuing..."
          }
          Remove-Item $patchFile
        }
        
        git status
        Push-Location schema
        Get-ChildItem -Name
        ./generate.ps1
        Set-Location ..
        git status
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python_version }}

    - name: install pipx
      if: matrix.os == 'macos-14'
      run: python -m pip install pipx

    - name: Set Python version for cibuildwheel
      run: |
        PYTHON_VERSION="${{ inputs.python_version }}"
        PYTHON_VERSION_MAJMIN="$(echo "${PYTHON_VERSION}" | cut -d '.' -f-2)"
        PYTHON_VERSION_MAJMIN_NODOT="${PYTHON_VERSION_MAJMIN//./}"
        echo "PYTHON_VERSION_MAJMIN_NODOT=${PYTHON_VERSION_MAJMIN_NODOT}" >> $GITHUB_ENV
        
        # Set build pattern based on OS
        if [[ "${{ matrix.os }}" == *"windows"* ]]; then
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == *"ubuntu"* ]]; then
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-manylinux*" >> $GITHUB_ENV
        else
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" >> $GITHUB_ENV
        fi
        
        echo "Python version: ${PYTHON_VERSION}"
        echo "Python version for cibuildwheel: ${CIBW_BUILD}"
      shell: bash

    - name: Process build options
      id: build_options
      run: |
        import os
        import sys
        
        # Get build options from input
        build_options = "${{ inputs.build_options }}"
        
        # Convert comma-separated options to space-separated
        build_args = build_options.replace(',', ' ')
        
        # Ensure llm is always included
        if "llm" not in build_args:
            build_args = f"{build_args} llm"
        
        # Remove leading/trailing spaces
        build_args = build_args.strip()
        
        # Set output for later steps
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"build_args={build_args}\n")
        
        print(f"Build options: {build_options}")
        print(f"Build args: {build_args}")
      shell: python

    - name: Get version from git tag
      id: get_version
      run: |
        # Try to get the latest tag
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$TAG" ]; then
          VERSION="1.0.0"
          echo "No git tag found, using default version: $VERSION"
        else
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          echo "Found git tag: $TAG, using version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      shell: bash

    - name: Set release environment variables
      id: set_env
      run: |
        import os
        from datetime import datetime
        
        # Set tag version
        tag_name = "${{ inputs.tag_name }}"
        if not tag_name:
            tag_name = "v${{ steps.get_version.outputs.version }}"
        print(f"TAG_VERSION={tag_name}")
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"TAG_VERSION={tag_name}\n")
        
        # Set build date
        build_date = "${{ inputs.build_date }}"
        if not build_date:
            build_date = datetime.now().strftime("%Y%m%d")
        print(f"BUILD_DATE={build_date}")
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"BUILD_DATE={build_date}\n")
        
        # Set CUDA version
        cuda_version = "${{ inputs.cuda_version }}"
        if cuda_version:
            print(f"CUDA_VERSION={cuda_version}")
            with open(os.environ['GITHUB_ENV'], 'a') as f:
                f.write(f"CUDA_VERSION={cuda_version}\n")
        
        # Set AVX version
        avxver = "${{ inputs.avxver }}"
        if avxver:
            print(f"AVXVER={avxver}")
            with open(os.environ['GITHUB_ENV'], 'a') as f:
                f.write(f"AVXVER={avxver}\n")
        
        # Set AVX compile flags
        enable_avx2 = "${{ inputs.enable_avx2 }}"
        enable_avx512 = "${{ inputs.enable_avx512 }}"
        
        # Build CMAKE flags for AVX options
        cmake_flags = []
        if enable_avx2 == '0':
            cmake_flags.append("-DMNN_AVX2=OFF")
        if enable_avx512 == '1':
            cmake_flags.append("-DMNN_AVX512=ON")
        
        if cmake_flags:
            avx_cmake_flags = " ".join(cmake_flags)
            print(f"AVX_CMAKE_FLAGS={avx_cmake_flags}")
            with open(os.environ['GITHUB_ENV'], 'a') as f:
                f.write(f"AVX_CMAKE_FLAGS={avx_cmake_flags}\n")
        
        # Auto-set avxver tag if not provided
        if not avxver:
            if enable_avx512 == '1':
                avxver = "avx512"
            elif enable_avx2 == '1':
                avxver = "avx2"
            else:
                avxver = "noavx"
            print(f"Auto-set AVXVER={avxver}")
            with open(os.environ['GITHUB_ENV'], 'a') as f:
                f.write(f"AVXVER={avxver}\n")
      shell: python

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.21.3
      env:
        CIBW_ARCHS_MACOS: ${{ matrix.arch }}
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ env.CIBW_BUILD }}
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ENVIRONMENT_LINUX: MNN_USE_SYSTEM_LIB=true MNN_SEP_BUILD=false CMAKE_BUILD_PARALLEL_LEVEL=2 MNN_VERSION=${{ steps.get_version.outputs.version }} BUILD_ARGS="${{ steps.build_options.outputs.build_args }}" CMAKE_ARGS="${{ env.AVX_CMAKE_FLAGS }}"
        CIBW_ENVIRONMENT_MACOS: CMAKE_BUILD_PARALLEL_LEVEL=2 MNN_VERSION=${{ steps.get_version.outputs.version }} BUILD_ARGS="${{ steps.build_options.outputs.build_args }}" CMAKE_ARGS="${{ env.AVX_CMAKE_FLAGS }}"
        CIBW_ENVIRONMENT_WINDOWS: CMAKE_BUILD_PARALLEL_LEVEL=2 MNN_VERSION=${{ steps.get_version.outputs.version }} BUILD_ARGS="${{ steps.build_options.outputs.build_args }}" CMAKE_ARGS="${{ env.AVX_CMAKE_FLAGS }}"
      with:
        package-dir: pymnn/pip_package
        output-dir: wheelhouse
        config-file: "{package}/pyproject.toml"

    - name: Show files
      run: ls -lh wheelhouse
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl

  create_release:
    name: Create Release
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: always() && inputs.create_release == '1'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: artifact-*
        path: dist
        merge-multiple: true

    - name: Show files
      run: ls -lh dist

    - name: Build tag name
      id: build_tag
      run: |
        import os
        
        tag_version = "${{ inputs.tag_name }}" or "v1.0.0"
        cuda_version = "${{ inputs.cuda_version }}"
        avxver = "${{ inputs.avxver }}"
        build_date = "${{ inputs.build_date }}"
        
        if not build_date:
            from datetime import datetime
            build_date = datetime.now().strftime("%Y%m%d")
        
        tag_parts = [tag_version]
        if cuda_version:
            tag_parts.append(f"cu{cuda_version}")
        if avxver:
            tag_parts.append(avxver)
        tag_parts.append(f"win-{build_date}")
        
        final_tag = "-".join(tag_parts)
        print(f"Final tag: {final_tag}")
        
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"tag_name={final_tag}\n")
      shell: python

    - name: Create Release
      uses: softprops/action-gh-release@v2.3.3
      with:
        files: dist/*
        tag_name: ${{ steps.build_tag.outputs.tag_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}