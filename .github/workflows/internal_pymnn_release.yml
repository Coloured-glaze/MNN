name: internal_pymnn_release
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        default: '3.10'
        required: true
        type: string
      build_options:
        description: 'Build options (comma-separated): llm, opencl, vulkan, openmp, trt, torch, cuda, internal, render, no_sse, cuda_tune'
        default: 'llm, opencl, vulkan, openmp'
        required: false
        type: string
      repository:
        description: 'Code repo'
        default: 'alibaba/MNN'
        required: true
        type: string
      run_os:
        description: 'Run OS (comma-separated for multiple: ubuntu-22.04,ubuntu-24.04-arm,windows-2025,windows-latest)'
        default: 'ubuntu-22.04, windows-latest'
        required: true
        type: string

jobs:
  parse_os_input:
    name: Parse OS input
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ steps.set-matrix.outputs.os_matrix }}
    steps:
      - name: Parse OS list
        id: set-matrix
        run: |
          import os
          run_os = "${{ inputs.run_os }}"
          os_list = [os.strip() for os in run_os.split(',')]
          import json
          print(f"OS list: {os_list}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"os_matrix={json.dumps(os_list)}\n")
        shell: python

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: parse_os_input
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.parse_os_input.outputs.os_matrix) }}

    steps:
    - name: Set architecture based on OS
      run: |
        import os
        runner_os = "${{ matrix.os }}"
        if "arm" in runner_os.lower():
            arch = "arm64"
        else:
            arch = "x86_64"
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"TARGET_ARCH={arch}\n")
        print(f"OS: {runner_os}, Architecture: {arch}")
      shell: python

    - uses: actions/checkout@v4
      with:
        submodules: true
        repository: ${{ inputs.repository }}

    - name: Free up disk space
      if: ${{ runner.os == 'Linux' }}
      run: |
        whoami
        df -h && free -g
        rm -rf /usr/share/dotnet > /dev/null || true
        rm -rf /opt/ghc > /dev/null || true
        rm -rf /opt/hostedtoolcache/CodeQL > /dev/null || true
        df -h && free -g
      shell: bash 

    - name: Setup Windows build tools
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
        
    - name: Setup Python ${{ inputs.python_version }}
      uses: actions/setup-python@v6
      with:
          python-version: ${{ inputs.python_version }}
          update-environment: true

    - name: Set Python version for cibuildwheel
      if: ${{ runner.os != 'Windows' }}
      run: |
        PYTHON_VERSION="${{ inputs.python_version }}"
        PYTHON_VERSION_MAJMIN="$(echo "${PYTHON_VERSION}" | cut -d '.' -f-2)"
        PYTHON_VERSION_MAJMIN_NODOT="${PYTHON_VERSION_MAJMIN//./}"
        echo "PYTHON_VERSION_MAJMIN_NODOT=${PYTHON_VERSION_MAJMIN_NODOT}" >> $GITHUB_ENV
        
        # Set build pattern based on OS
        if [[ "${{ matrix.os }}" == *"windows"* ]]; then
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == *"ubuntu"* ]]; then
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-manylinux*" >> $GITHUB_ENV
        else
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" >> $GITHUB_ENV
        fi
        
        echo "Python version: ${PYTHON_VERSION}"
        echo "Python version for cibuildwheel: ${CIBW_BUILD}"
      shell: bash

    - name: Process build options
      id: build_options
      run: |
        import os
        import sys
        
        # Get build options from input
        build_options = "${{ inputs.build_options }}"
        
        # Convert comma-separated options to space-separated
        build_args = build_options.replace(',', ' ')
        
        # Ensure llm is always included
        if "llm" not in build_args:
            build_args = f"{build_args} llm"
        
        # Remove leading/trailing spaces
        build_args = build_args.strip()
        
        # Set output for later steps
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"build_args={build_args}\n")
        
        print(f"Build options: {build_options}")
        print(f"Build args: {build_args}")
      shell: python

    - name: Get version from git tag
      id: get_version
      run: |
        # Try to get the latest tag
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$TAG" ]; then
          VERSION="1.0.0"
          echo "No git tag found, using default version: $VERSION"
        else
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          echo "Found git tag: $TAG, using version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "mnn_commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        
        # Set TAG_VERSION and BUILD_DATE environment variables
        echo "TAG_VERSION=$VERSION" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
        
        echo "TAG_VERSION: $VERSION"
        echo "BUILD_DATE: $(date +'%Y%m%d')"
        echo $mnn_commit_hash
      shell: bash

    - name: Build wheels (Linux)
      if: ${{ runner.os != 'Windows' }}
      uses: pypa/cibuildwheel@v2.21.3
      env:
        CIBW_ARCHS_LINUX: "native"
        CIBW_BUILD: ${{ env.CIBW_BUILD }}
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ENVIRONMENT_LINUX: MNN_USE_SYSTEM_LIB=true MNN_SEP_BUILD=false CMAKE_BUILD_PARALLEL_LEVEL=2 MNN_VERSION=${{ steps.get_version.outputs.version }} BUILD_ARGS="${{ steps.build_options.outputs.build_args }}"
      with:
        package-dir: pymnn/pip_package
        output-dir: wheelhouse
        config-file: "{package}/pyproject.toml"
    
    - name: Modify build_deps.py for Windows
      if: ${{ runner.os == 'Windows' }}
      run: |
        import os
        
        # Path to build_deps.py
        file_path = 'pymnn/pip_package/build_deps.py'
        
        # Read the file content
        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()
        
        # Replace the target text
        old_text = '-DMNN_BUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DMNN_WIN_RUNTIME_MT=ON'
        new_text = '-DMNN_BUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DMNN_WIN_RUNTIME_MT=ON -DMNN_USE_SYSTEM_LIB=ON'
        content = content.replace(old_text, new_text)
        
        # Write the modified content back
        with open(file_path, 'w', encoding='utf-8') as f:
            f.write(content)
        
        print("Modified build_deps.py successfully")
      shell: python

    - name: Build wheels (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: |
        # Set TAG_VERSION and BUILD_DATE environment variables for Windows
        $VERSION = "${{ steps.get_version.outputs.version }}"
        $BUILD_DATE = Get-Date -Format "yyyyMMdd"
        echo "TAG_VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        echo "BUILD_DATE=$BUILD_DATE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        echo "TAG_VERSION: $VERSION"
        echo "BUILD_DATE: $BUILD_DATE"
        
        pip install packaging ninja build wheel setuptools numpy 
        python -c "import numpy; print('numpy installed successfully:', numpy.__version__)"
        cd pymnn/pip_package
        python build_deps.py ${{ steps.build_options.outputs.build_args }}
        python -W ignore setup.py bdist_wheel
        if (-not (Test-Path "..\..\wheelhouse")) { New-Item -ItemType Directory -Path "..\..\wheelhouse" }
        Copy-Item dist/*.whl ..\..\wheelhouse\
        Get-ChildItem ..\..\wheelhouse
      shell: powershell

    - name: Show files
      run: |
        pwd && ls &&  ls -lh wheelhouse
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.os }}
        path: wheelhouse/*.whl
        compression-level: 9 
        retention-days: 14

    - name: Create Release
      if: always() && env.TAG_VERSION != ''
      uses: softprops/action-gh-release@v2.3.3
      with:
        files: wheelhouse/*.whl
        tag_name: v${{ env.TAG_VERSION }}-${{ env.BUILD_DATE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}